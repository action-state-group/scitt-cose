# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scitt-cose"
version = "0.2.0"
description = "Generic, payload-agnostic IETF SCITT + COSE Receipts substrate for Python (receipts: RFC9162_SHA256 vds=1 or CCF ccf.v1 vds=2)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["scitt", "cose", "cose-sign1", "receipts", "merkle", "rfc9162", "transparency"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cbor2>=5.5",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/scitt-cose"
Source = "https://github.com/action-state-group/scitt-cose"
Issues = "https://github.com/action-state-group/scitt-cose/issues"

[project.optional-dependencies]
# pycose is a THIRD-PARTY COSE library used ONLY in tests as an independent
# conformance oracle (test_thirdparty_cose.py); never imported at runtime.
# build (+ its setuptools/wheel build backend) is used ONLY by
# test_packaging.py to build a real sdist artifact and assert on its
# contents; never imported at runtime. Pinned explicitly rather than relying
# on the base Python image to ship setuptools ambiently -- it doesn't on
# every image (e.g. CI's 3.12 runner vs. 3.9), which left `build --no-isolation`
# without a backend and failed CI.
dev = ["pytest>=7.0", "ruff>=0.4,<0.16", "pycose>=1.1", "build>=1.0", "setuptools>=68", "wheel"]
# serve: pulls in a production ASGI server for running the hosted verify
# surface (hosted_profiles/hosted.py) from a full repo checkout — see the
# Dockerfile. hosted_profiles/ is NOT part of this package (excluded from the
# wheel below); this extra has no effect on `pip install scitt-cose` alone,
# it only benefits a full checkout that also wants uvicorn.
serve = ["uvicorn[standard]>=0.27"]

[project.scripts]
scitt-cose = "scitt_cose.cli:main"

[tool.setuptools]
packages = ["scitt_cose"]

[tool.pytest.ini_options]
markers = [
    "integration: live-network tests that require external services (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
