# SPDX-License-Identifier: Apache-2.0
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # The package releases under bare v<version> tags. Other tags in this
    # repository (rust-scitt-cose-v*, vectors-*) belong to other artifacts and
    # must not publish to PyPI; the guard below refuses anything the prefix
    # lets through.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC — no token stored
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: require a matching tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/check_python_release.py "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
