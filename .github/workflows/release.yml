# SPDX-License-Identifier: Apache-2.0
# Publishes the package to PyPI via OIDC trusted publishing for a
# v<version> tag, which tag-release.yml creates when a version bump merges.
# See RELEASING.md.
name: Release · Publish Python

on:
  release:
    types: [published]
  # tag-release.yml dispatches this on the v<version> tag it creates.
  # Dispatched on a branch, it does nothing.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    # The package releases under bare v<version> tags. Other tags in this
    # repository (rust-scitt-cose-v*, vectors-*) belong to other artifacts and
    # must not publish to PyPI: vectors-* also starts with "v", so it is
    # excluded here, and the guard below refuses anything else the prefix lets
    # through.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') &&
       !startsWith(github.event.release.tag_name, 'vectors-')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') &&
       !startsWith(github.ref, 'refs/tags/vectors-'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC — no token stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: require a matching tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python .github/release.py check python "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
