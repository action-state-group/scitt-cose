# SPDX-License-Identifier: Apache-2.0
# leak-lint — fail the build if internal coordination-layer text (bracketed task ids, queue
# vocabulary, private-workspace paths, or named-decider governance prose) reaches this public
# repo. No secret needed (unlike neutrality.yml, whose reserved-term list is intentionally kept
# out of the repo) -- the patterns this check bans are generic ops-vocabulary shapes, not a
# list that itself needs hiding -- so this runs on plain pull_request like hostname-lint.yml.
name: Leak lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run, so
# superseded runs don't hold the org's shared runners. Runs on main are never
# cancelled: each is grouped by its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Every run step uses bash with -eo pipefail, so a failing command in a pipe
# fails the step (an unset shell runs `bash -e` without pipefail).
defaults:
  run:
    shell: bash

jobs:
  leak-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python .github/leak_lint.py .
