# SPDX-License-Identifier: Apache-2.0
# DCO sign-off enforcement — replaces the hosted probot DCO app with a
# self-contained Actions job that is outage-proof and pinned.
#
# Branch protection: require the "DCO / dco" check (Settings → Branches →
# Require status checks → search "dco"). Drop the "DCO" probot app entry.
name: DCO

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run, so
# superseded runs don't hold the org's shared runners. Runs on main are never
# cancelled: each is grouped by its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Every run step uses bash with -eo pipefail, so a failing command in a pipe
# fails the step (an unset shell runs `bash -e` without pipefail).
defaults:
  run:
    shell: bash

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check all commits carry a DCO Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/dco_check.sh "$BASE_SHA" "$HEAD_SHA"
