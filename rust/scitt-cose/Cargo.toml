[package]
name = "scitt-cose-receipt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline verifier for SCITT COSE Receipts with RFC 9162 SHA-256 inclusion proofs: checks the log's signature under a pinned key and rebuilds the Merkle root. No network code, no receipt issuance."
repository = "https://github.com/action-state-group/scitt-cose"
readme = "README.md"
keywords = ["scitt", "cose", "rfc9162", "merkle", "receipt"]
categories = ["cryptography", "command-line-utilities"]
# The test vectors live at the repository root, outside this crate, so the
# integration tests run from a checkout and are left out of the package.
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "scitt_cose_receipt"
path = "src/lib.rs"

[[bin]]
name = "scitt-cose-rust-verify"
path = "src/bin/verify.rs"

[dependencies]
coset = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["pem"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
