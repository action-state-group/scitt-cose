[package]
name = "scitt-cose-receipt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vendor-neutral offline verifier for SCITT/RFC 9162 COSE receipts (Rust sibling of the scitt-cose Python and Go verifiers). No network code, no receipt issuance, no cll dependency -- receipts are SCITT, not CLL."
repository = "https://github.com/action-state-group/scitt-cose"
keywords = ["scitt", "cose", "rfc9162", "merkle", "receipt"]
categories = ["cryptography"]
publish = false

[lib]
name = "scitt_cose_receipt"
path = "src/lib.rs"

[[bin]]
name = "scitt-cose-rust-verify"
path = "src/bin/verify.rs"

[dependencies]
coset = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["pem"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
